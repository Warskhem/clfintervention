<!DOCTYPE html>

  <link rel="stylesheet" href="css/style.css?v=20260806b">
</head>
<body>
  <header class="header header-block">
    <div class="header-content">
      <div class="nav-bar">
        <a href="index.html" class="back-btn">&larr; Back to Map</a>
      </div>
      <h1 class="block-name" id="blockName"></h1>
      <p class="block-subtitle" id="blockSubtitle"></p>
      <div class="block-summary" id="blockSummary"></div>

  <main class="main">
    <section class="clf-section">
      <h2 class="section-title">CLF Details</h2>

        <h3 class="modal-title" id="modalTitle"></h3>

    <p>Data sourced from WKH District Intervention Spreadsheet</p>
